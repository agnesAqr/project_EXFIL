    <!-- Summary -->

    <text x="120" y="432" fill="#8b949e" font-size="9">위에서 아래로 Y 후보를 훑고, 각 Y에서 3칸짜리 마스크를 왼쪽에서 오른쪽으로 민다.</text>

    <text x="65" y="460" fill="#d29922" font-size="10" font-weight="600">1. 입력 크기</text>
    <text x="170" y="460" fill="#8b949e" font-size="10">W=3, H=2 → BaseMask = 0b111. GridWidth=10이므로 X 후보는 0..7.</text>

    <text x="65" y="488" fill="#d29922" font-size="10" font-weight="600">2. Y=0 검사</text>
    <text x="170" y="488" fill="#8b949e" font-size="10">아이템 높이가 2라서 Row 0과 Row 1을 OR로 병합한다.</text>
    <text x="170" y="508" fill="#8b949e" font-size="10">const uint16 Merged = R0 | R1;  // 0x17 | 0x0C = 0x1F</text>

    <text x="65" y="536" fill="#d29922" font-size="10" font-weight="600">3. X 슬라이딩</text>
    <text x="170" y="536" fill="#8b949e" font-size="10">BaseMask를 X만큼 shift해서 3칸 후보 영역과 Merged를 AND 한다.</text>

    <text x="135" y="564" fill="#8b949e" font-size="9">cols 0,1,2</text>
    <text x="230" y="564" fill="#f85149" font-size="9">충돌</text>
    <text x="285" y="564" fill="#8b949e" font-size="10">X=1</text>
    <text x="330" y="564" fill="#8b949e" font-size="9">cols 1,2,3</text>
    <text x="425" y="564" fill="#f85149" font-size="9">충돌</text>

    <text x="620" y="564" fill="#f85149" font-size="9">충돌</text>

    <text x="230" y="588" fill="#f85149" font-size="9">충돌</text>
    <text x="285" y="588" fill="#8b949e" font-size="10">X=4</text>
    <text x="330" y="588" fill="#8b949e" font-size="9">cols 4,5,6</text>
    <text x="425" y="588" fill="#f85149" font-size="9">충돌</text>
    <text x="480" y="588" fill="#8b949e" font-size="10">X=5</text>
    <text x="525" y="588" fill="#8b949e" font-size="9">cols 5,6,7</text>
    <text x="620" y="588" fill="#3fb950" font-size="9" font-weight="600">통과</text>

    <text x="65" y="624" fill="#d29922" font-size="10" font-weight="600">4. 첫 성공 위치</text>
    <text x="170" y="624" fill="#8b949e" font-size="10">X=5에서 Merged &amp; (0b111 &lt;&lt; 5) == 0 이므로 충돌이 없다.</text>

    <rect x="60" y="646" width="875" height="48" rx="4" fill="#0d1117" stroke="#238636"/>
    <text x="80" y="674" fill="#3fb950" font-size="12" font-weight="700">return OutPosition = (col=5, row=0)</text>
    <text x="355" y="674" fill="#8b949e" font-size="10">상단 MED 오른쪽의 3×2 빈 영역을 찾고 즉시 종료한다. Y=1 이후는 검사하지 않는다.</text>

    <text x="50" y="725" fill="#58a6ff" font-size="10" font-weight="600">핵심</text>
    <text x="105" y="725" fill="#8b949e" font-size="9">H개 행을 OR로 합쳐 후보 높이 안의 점유 열을 하나로 만들고, X 후보마다 3비트 마스크와 AND해서 충돌 여부를 판정한다.</text>
    <text x="105" y="743" fill="#8b949e" font-size="9">칸 단위 사각형 검사 대신 비트 연산으로 첫 배치 가능 위치를 빠르게 찾는 구조다.</text>
